name: Update profile assets

on:
  schedule:
    # Poll at GitHub's minimum supported interval, away from minute zero.
    # Scheduled jobs can still be delayed or dropped by GitHub.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/update_stats.py'
      - 'tests/test_update_stats.py'
      - '.github/workflows/profile.yml'
  watch:
    types: [started]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run profile tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify authenticated public data
        run: python3 scripts/update_stats.py
        env:
          PROFILE_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check refresh and cache invalidation behavior
        run: python3 -m unittest discover -s tests -v

      - name: Generate public GitHub statistics
        id: stats
        run: python3 scripts/update_stats.py
        env:
          PROFILE_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PROFILE_REFRESH: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}

      - name: Publish statistics without waiting for snake generation
        run: python3 scripts/update_stats.py --publish-cards

      - name: Save refreshed statistics immediately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/github-stats-dark.svg assets/profile-data.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public profile statistics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Generate contribution snake animations
        if: steps.stats.outputs.snake_changed == 'true'
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=%230969da&color_dots=%23eff2f5,%23aceebb,%234ac26b,%232da44e,%23116329
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%234493f8&color_dots=%23151b23,%23033a16,%23196c2e,%232ea043,%2356d364
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Match GitHub default contribution borders
        if: steps.stats.outputs.snake_changed == 'true'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name, border in [
              ('github-contribution-grid-snake.svg', '#1f23280d'),
              ('github-contribution-grid-snake-dark.svg', '#0104090d'),
          ]:
              path = Path('assets') / name
              source, count = re.subn(r'--cb:[^;}]+', '--cb:' + border, path.read_text(encoding='utf-8'))
              if count != 1:
                  raise RuntimeError(f'Expected one contribution border variable in {name}; found {count}')
              path.write_text(source, encoding='utf-8')
          PY

      - name: Version README image URLs after all assets are ready
        if: steps.stats.outputs.snake_changed == 'true'
        run: python3 scripts/update_stats.py --publish

      - name: Save changed assets and their README cache keys together
        if: steps.stats.outputs.snake_changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg assets/profile-data.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile statistics and contribution snakes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
