name: Update profile assets

on:
  schedule:
    # 09:17 in China (UTC+8); avoid the busy start of the hour.
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate public GitHub statistics
        run: python3 scripts/update_stats.py
        env:
          PROFILE_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=%230969da&color_dots=%23eff2f5,%23aceebb,%234ac26b,%232da44e,%23116329
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%234493f8&color_dots=%23151b23,%23033a16,%23196c2e,%232ea043,%2356d364
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Match GitHub default contribution borders
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name, border in [
              ('github-contribution-grid-snake.svg', '#1f23280d'),
              ('github-contribution-grid-snake-dark.svg', '#0104090d'),
          ]:
              path = Path('assets') / name
              source, count = re.subn(r'--cb:[^;}]+', '--cb:' + border, path.read_text(encoding='utf-8'))
              if count != 1:
                  raise RuntimeError(f'Expected one contribution border variable in {name}; found {count}')
              path.write_text(source, encoding='utf-8')
          PY

      - name: Save generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile statistics and contribution snakes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
